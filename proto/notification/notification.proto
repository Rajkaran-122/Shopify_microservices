syntax = "proto3";

package notification;

option go_package = "digital-metro/ecomm_java/proto/notification;notification";

service NotificationService {
  rpc SendOrderNotification(OrderNotificationRequest) returns (NotificationResponse);
  rpc SendEmailNotification(EmailNotificationRequest) returns (NotificationResponse);
  rpc GetNotificationHistory(NotificationHistoryRequest) returns (NotificationHistoryResponse);
}

message OrderNotificationRequest {
  string user_id = 1;
  string order_id = 2;
  string user_email = 3;
  string order_status = 4;
  double amount = 5;
}

message EmailNotificationRequest {
  string recipient_email = 1;
  string subject = 2;
  string body = 3;
  string email_type = 4;
}

message NotificationResponse {
  bool success = 1;
  string message = 2;
  string notification_id = 3;
}

message Notification {
  string id = 1;
  string user_id = 2;
  string type = 3;
  string content = 4;
  string status = 5;
  string created_at = 6;
}

message NotificationHistoryRequest {
  string user_id = 1;
  int32 page = 2;
  int32 limit = 3;
}

message NotificationHistoryResponse {
  repeated Notification notifications = 1;
  int32 total = 2;
  bool success = 3;
}
