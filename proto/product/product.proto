syntax = "proto3";

package product;

option go_package = "digital-metro/ecomm_java/proto/product;product";

service ProductService {
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
  rpc GetProduct(GetProductRequest) returns (GetProductResponse);
  rpc CreateProduct(CreateProductRequest) returns (CreateProductResponse);
  rpc UpdateProductInventory(UpdateInventoryRequest) returns (UpdateInventoryResponse);
  rpc CheckInventory(CheckInventoryRequest) returns (CheckInventoryResponse);
}

message Product {
  string id = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  string category = 5;
  int32 quantity = 6;
  string image_url = 7;
  string created_at = 8;
  string updated_at = 9;
}

message ListProductsRequest {
  int32 page = 1;
  int32 limit = 2;
  string category = 3;
}

message ListProductsResponse {
  repeated Product products = 1;
  int32 total = 2;
  bool success = 3;
}

message GetProductRequest {
  string product_id = 1;
}

message GetProductResponse {
  bool success = 1;
  Product product = 2;
}

message CreateProductRequest {
  string name = 1;
  string description = 2;
  double price = 3;
  string category = 4;
  int32 quantity = 5;
  string image_url = 6;
}

message CreateProductResponse {
  bool success = 1;
  Product product = 2;
  string message = 3;
}

message UpdateInventoryRequest {
  string product_id = 1;
  int32 quantity_change = 2;
}

message UpdateInventoryResponse {
  bool success = 1;
  int32 new_quantity = 2;
}

message CheckInventoryRequest {
  string product_id = 1;
  int32 required_quantity = 2;
}

message CheckInventoryResponse {
  bool available = 1;
  int32 current_quantity = 2;
}
