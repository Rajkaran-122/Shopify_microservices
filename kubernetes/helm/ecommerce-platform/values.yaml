# =============================================================================
# Helm Values — Platform Default Configuration
# =============================================================================
# All services inherit these defaults. Override per-environment in
# values-staging.yaml and values-production.yaml.
# =============================================================================

global:
  environment: development
  imageRegistry: ""  # Set to ECR URL in production
  imagePullPolicy: IfNotPresent
  serviceAccount:
    create: true
    name: ecommerce-sa

  # Istio service mesh annotations (BRD: mTLS enforcement)
  istio:
    enabled: true
    mtls: STRICT

  # Observability endpoints (BRD NFR-OBS-001 through NFR-OBS-005)
  observability:
    otlpEndpoint: "otel-collector:4317"
    prometheusPort: 9090
    traceSampleRate: 1.0

  # Feature flags (BRD Section 8.4)
  featureFlags:
    enabled: false
    provider: unleash
    endpoint: "http://unleash:4242/api"

# =============================================================================
# Per-Service Configuration
# =============================================================================

apiGateway:
  replicaCount: 3
  image:
    repository: ecommerce-platform/api-gateway
    tag: latest
  service:
    type: LoadBalancer
    port: 8080
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 50
    targetCPUUtilization: 70
    targetMemoryUtilization: 80
  probes:
    liveness:
      path: /health/live
      initialDelaySeconds: 10
      periodSeconds: 15
    readiness:
      path: /health/ready
      initialDelaySeconds: 5
      periodSeconds: 10
    startup:
      path: /health/startup
      failureThreshold: 30
      periodSeconds: 5
  env:
    - name: GRPC_USER_SERVICE
      value: "user-service:50051"
    - name: GRPC_PRODUCT_SERVICE
      value: "product-service:50052"
    - name: GRPC_ORDER_SERVICE
      value: "order-service:50053"
    - name: GRPC_PAYMENT_SERVICE
      value: "payment-service:50055"
    - name: GRPC_INVENTORY_SERVICE
      value: "inventory-service:50056"
    - name: GRPC_CART_SERVICE
      value: "cart-service:50057"

userService:
  replicaCount: 3
  image:
    repository: ecommerce-platform/user-service
    tag: latest
  service:
    type: ClusterIP
    port: 50051
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 100
    targetCPUUtilization: 70
  env:
    - name: DB_HOST
      value: "postgres-user"
    - name: DB_NAME
      value: "user_db"

productService:
  replicaCount: 3
  image:
    repository: ecommerce-platform/product-service
    tag: latest
  service:
    type: ClusterIP
    port: 50052
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 200
    targetCPUUtilization: 60
  env:
    - name: DB_HOST
      value: "postgres-product"
    - name: REDIS_HOST
      value: "redis"

orderService:
  replicaCount: 3
  image:
    repository: ecommerce-platform/order-service
    tag: latest
  service:
    type: ClusterIP
    port: 50053
  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 150
    targetCPUUtilization: 70
  env:
    - name: DB_HOST
      value: "postgres-order"
    - name: KAFKA_BROKERS
      value: "kafka:9092"

paymentService:
  replicaCount: 3
  image:
    repository: ecommerce-platform/payment-service
    tag: latest
  service:
    type: ClusterIP
    port: 50055
  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 100
    targetCPUUtilization: 60
  # PCI-DSS: Runs in isolated payment-cde namespace
  namespace: payment-cde

inventoryService:
  replicaCount: 3
  image:
    repository: ecommerce-platform/inventory-service
    tag: latest
  service:
    type: ClusterIP
    port: 50056
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 100
    targetCPUUtilization: 70

cartService:
  replicaCount: 3
  image:
    repository: ecommerce-platform/cart-service
    tag: latest
  service:
    type: ClusterIP
    port: 50057
  resources:
    requests:
      cpu: 150m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 200
    targetCPUUtilization: 70

notificationService:
  replicaCount: 2
  image:
    repository: ecommerce-platform/notification-service
    tag: latest
  service:
    type: ClusterIP
    port: 50054
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 50
    targetCPUUtilization: 75

# =============================================================================
# Infrastructure Dependencies
# =============================================================================

postgresql:
  enabled: true
  instances:
    - name: postgres-user
      database: user_db
      port: 5432
    - name: postgres-product
      database: product_db
      port: 5433
    - name: postgres-order
      database: order_db
      port: 5434
    - name: postgres-payment
      database: payment_db
      port: 5435

redis:
  enabled: true
  architecture: replication
  replica:
    replicaCount: 3
  auth:
    enabled: true

kafka:
  enabled: true
  replicaCount: 3
  topics:
    - name: order.events
      partitions: 12
      replicationFactor: 3
    - name: payment.events
      partitions: 12
      replicationFactor: 3
    - name: inventory.events
      partitions: 6
      replicationFactor: 3
    - name: notification.events
      partitions: 6
      replicationFactor: 3

# =============================================================================
# Pod Disruption Budgets (BRD NFR-REL-003: N+2 redundancy)
# =============================================================================
podDisruptionBudget:
  enabled: true
  minAvailable: 2  # Ensures N+2: at least 2 pods always running

# =============================================================================
# Network Policies (BRD Section 10.1: Zero-trust, default-deny)
# =============================================================================
networkPolicies:
  enabled: true
  defaultDeny: true
