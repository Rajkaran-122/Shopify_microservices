{{- range $name, $svc := .Values }}
{{- if and (kindIs "map" $svc) (hasKey $svc "image") }}
---
# =============================================================================
# Deployment: {{ $name }}
# =============================================================================
# FAANG-grade deployment with:
# - Liveness/Readiness/Startup probes (BRD Section 7.5)
# - Resource limits and requests
# - Istio sidecar injection (BRD Section 10.1: mTLS)
# - Anti-affinity for HA across AZs (BRD NFR-REL-003: N+2 redundancy)
# - Graceful shutdown with preStop hook
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $svc.namespace | default $.Release.Namespace }}
  labels:
    app: {{ $name }}
    version: {{ $svc.image.tag | default "latest" }}
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: ecommerce-platform
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
  annotations:
    # ArgoCD GitOps tracking
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ $svc.replicaCount | default 3 }}
  selector:
    matchLabels:
      app: {{ $name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Zero-downtime deployments
  template:
    metadata:
      labels:
        app: {{ $name }}
        version: {{ $svc.image.tag | default "latest" }}
      annotations:
        # Istio sidecar injection for mTLS
        sidecar.istio.io/inject: "{{ $.Values.global.istio.enabled | default true }}"
        # Prometheus scraping
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ $.Values.global.serviceAccount.name | default "ecommerce-sa" }}

      # Anti-affinity: spread pods across AZs for HA
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - {{ $name }}
                topologyKey: topology.kubernetes.io/zone

      # Graceful shutdown: allow 30s for in-flight requests
      terminationGracePeriodSeconds: 30

      containers:
        - name: {{ $name }}
          image: "{{ $.Values.global.imageRegistry }}{{ $svc.image.repository }}:{{ $svc.image.tag | default "latest" }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "IfNotPresent" }}

          ports:
            - name: grpc
              containerPort: {{ $svc.service.port }}
              protocol: TCP
            - name: metrics
              containerPort: 9091
              protocol: TCP

          # Environment variables
          env:
            - name: SERVICE_NAME
              value: {{ $name }}
            - name: ENVIRONMENT
              value: {{ $.Values.global.environment | default "production" }}
            - name: OTLP_ENDPOINT
              value: {{ $.Values.global.observability.otlpEndpoint | default "otel-collector:4317" }}
            - name: TRACE_SAMPLE_RATE
              value: "{{ $.Values.global.observability.traceSampleRate | default 1.0 }}"
            {{- range $svc.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}

          # Database credentials from Kubernetes Secrets (not env vars)
          envFrom:
            - secretRef:
                name: {{ $name }}-secrets
                optional: true

          # Resource limits (BRD NFR-SCALE-002)
          resources:
            requests:
              cpu: {{ $svc.resources.requests.cpu | default "100m" }}
              memory: {{ $svc.resources.requests.memory | default "128Mi" }}
            limits:
              cpu: {{ $svc.resources.limits.cpu | default "500m" }}
              memory: {{ $svc.resources.limits.memory | default "512Mi" }}

          # Liveness probe: "Is the process alive?" (BRD Section 7.5)
          livenessProbe:
            httpGet:
              path: {{ ($svc.probes).liveness.path | default "/health/live" }}
              port: metrics
            initialDelaySeconds: {{ ($svc.probes).liveness.initialDelaySeconds | default 10 }}
            periodSeconds: {{ ($svc.probes).liveness.periodSeconds | default 15 }}
            timeoutSeconds: 3
            failureThreshold: 3

          # Readiness probe: "Is the service ready for traffic?" (BRD Section 7.5)
          readinessProbe:
            httpGet:
              path: {{ ($svc.probes).readiness.path | default "/health/ready" }}
              port: metrics
            initialDelaySeconds: {{ ($svc.probes).readiness.initialDelaySeconds | default 5 }}
            periodSeconds: {{ ($svc.probes).readiness.periodSeconds | default 10 }}
            timeoutSeconds: 3
            failureThreshold: 3

          # Startup probe: prevents liveness kills during slow startup
          startupProbe:
            httpGet:
              path: {{ ($svc.probes).startup.path | default "/health/startup" }}
              port: metrics
            failureThreshold: {{ ($svc.probes).startup.failureThreshold | default 30 }}
            periodSeconds: {{ ($svc.probes).startup.periodSeconds | default 5 }}

          # Graceful shutdown hook
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $svc.namespace | default $.Release.Namespace }}
  labels:
    app: {{ $name }}
spec:
  type: {{ $svc.service.type | default "ClusterIP" }}
  ports:
    - port: {{ $svc.service.port }}
      targetPort: grpc
      protocol: TCP
      name: grpc
    - port: 9091
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    app: {{ $name }}

{{- end }}
{{- end }}
