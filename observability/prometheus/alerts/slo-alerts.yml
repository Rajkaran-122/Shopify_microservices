# SLO-Based Alerting Rules — Per BRD NFR-OBS-004 & NFR-OBS-005
# Detection time: < 2 minutes for SLO breaches
# Error budget burn rate alerts at 1-hour and 6-hour windows (Google SRE model)

groups:
  # ================================================================
  # Golden Signals Alerts (Latency, Traffic, Errors, Saturation)
  # ================================================================
  - name: golden_signals
    interval: 15s
    rules:
      # HIGH ERROR RATE — P0
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{status=~"5.."}[5m])) by (service)
            /
            sum(rate(http_requests_total[5m])) by (service)
          ) > 0.01
        for: 2m
        labels:
          severity: critical
          team: platform-engineering
        annotations:
          summary: "High error rate on {{ $labels.service }}"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 1%)"
          runbook_url: "https://wiki.digital-metro.com/runbooks/high-error-rate"

      # HIGH LATENCY — P1
      - alert: HighLatencyP99
        expr: |
          histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
          team: platform-engineering
        annotations:
          summary: "P99 latency exceeded 500ms on {{ $labels.service }}"
          description: "P99 latency is {{ $value }}s (BRD target: < 100ms)"

      # CHECKOUT LATENCY — P0 (BRD: P99 < 200ms)
      - alert: CheckoutLatencyBreach
        expr: |
          histogram_quantile(0.99,
            rate(http_request_duration_seconds_bucket{path="/api/orders"}[5m])
          ) > 0.2
        for: 2m
        labels:
          severity: critical
          team: commerce-squad
        annotations:
          summary: "Checkout P99 latency exceeded 200ms SLO"
          description: "Checkout latency is {{ $value }}s"

      # HIGH SATURATION — P1
      - alert: HighCPUUtilization
        expr: |
          (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU utilization above 85%"

      # TRAFFIC ANOMALY — P2
      - alert: TrafficDrop
        expr: |
          rate(http_requests_total[5m]) < (rate(http_requests_total[1h] offset 1d) * 0.5)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Traffic dropped >50% compared to same time yesterday"

  # ================================================================
  # SLO Burn Rate Alerts (Google SRE Model — BRD NFR-OBS-005)
  # ================================================================
  - name: slo_burn_rate
    interval: 30s
    rules:
      # FAST BURN — consuming error budget rapidly (1h window)
      - alert: SLOBurnRateFast
        expr: |
          (
            sum(rate(http_requests_total{status=~"5.."}[1h])) by (service)
            /
            sum(rate(http_requests_total[1h])) by (service)
          ) > (14.4 * 0.001)
        for: 2m
        labels:
          severity: critical
          category: slo
        annotations:
          summary: "Fast SLO burn rate on {{ $labels.service }}"
          description: "Error budget will be exhausted in < 2 hours at current rate"

      # SLOW BURN — steady error budget consumption (6h window)
      - alert: SLOBurnRateSlow
        expr: |
          (
            sum(rate(http_requests_total{status=~"5.."}[6h])) by (service)
            /
            sum(rate(http_requests_total[6h])) by (service)
          ) > (6 * 0.001)
        for: 15m
        labels:
          severity: warning
          category: slo
        annotations:
          summary: "Slow SLO burn rate on {{ $labels.service }}"
          description: "Error budget consumption rate is elevated over 6h window"

  # ================================================================
  # Infrastructure Alerts
  # ================================================================
  - name: infrastructure
    rules:
      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL instance {{ $labels.instance }} is down"

      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis instance {{ $labels.instance }} is down"

      - alert: KafkaConsumerLag
        expr: kafka_consumergroup_lag > 10000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag exceeded 10K on {{ $labels.topic }}"
          description: "BRD target: < 10s normal, < 60s peak"

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space below 10% on {{ $labels.instance }}"

  # ================================================================
  # Payment Service Alerts (PCI-DSS Compliance)
  # ================================================================
  - name: payment_alerts
    rules:
      - alert: PaymentFailureRate
        expr: |
          (
            sum(rate(payment_transactions_total{status="failed"}[5m]))
            /
            sum(rate(payment_transactions_total[5m]))
          ) > 0.05
        for: 2m
        labels:
          severity: critical
          team: payments-squad
          compliance: pci-dss
        annotations:
          summary: "Payment failure rate exceeded 5%"

      - alert: FraudRateHigh
        expr: |
          (
            sum(rate(fraud_detections_total{action="blocked"}[1h]))
            /
            sum(rate(payment_transactions_total[1h]))
          ) > 0.01
        for: 15m
        labels:
          severity: warning
          team: payments-squad
        annotations:
          summary: "Fraud detection rate exceeded 1%"
